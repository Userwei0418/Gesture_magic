<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureHand - 辅助手语系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Noto+Sans+SC:wght@500;900&display=swap');
        
        body { font-family: 'Noto Sans SC', sans-serif; margin: 0; overflow: hidden; background: #000; }
        
        #input-video { display: none; }
        
        #output-canvas { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(6, 182, 212, 0.2); 
            z-index: 10; 
        }
        
        #three-canvas {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 20;
        }

        /* 顶部导航：支持水平滚动以容纳更多手势 */
        .gesture-nav {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            background: rgba(8, 10, 15, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 8px 15px;
            display: flex; gap: 15px;
            z-index: 60;
            max-width: 90vw; overflow-x: auto; /* 允许小屏幕滚动 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            /* 隐藏滚动条 */
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .gesture-nav::-webkit-scrollbar { display: none; }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; min-width: 45px;
            opacity: 0.4; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-item.active {
            opacity: 1; transform: scale(1.15) translateY(-2px);
            text-shadow: 0 0 15px currentColor;
        }
        .nav-emoji { font-size: 1.5rem; margin-bottom: 2px; }
        .nav-text { font-size: 0.7rem; font-weight: 700; white-space: nowrap; }

        /* 大标题特效 */
        .hero-text {
            position: absolute; bottom: 18%; left: 50%; transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif; font-size: 5rem; font-weight: 900;
            text-align: center; pointer-events: none; text-transform: uppercase;
            letter-spacing: 4px; color: transparent;
            -webkit-text-stroke: 2px rgba(255,255,255,0.8);
            opacity: 0; transition: all 0.2s; z-index: 50; white-space: nowrap;
        }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%);
            background-size: 100% 4px; z-index: 30; pointer-events: none;
        }

        #loading {
            position: fixed; inset: 0; background: #02040a; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #06b6d4;
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="w-12 h-12 border-4 border-cyan-800 border-t-cyan-400 rounded-full animate-spin mb-4"></div>
        <div class="font-mono tracking-widest text-xs">SYSTEM INITIALIZING</div>
    </div>

    <div class="gesture-nav">
        <div class="nav-item" id="nav-yes" style="color: #4ADE80"><span class="nav-emoji">👍</span><span class="nav-text">确认</span></div>
        <div class="nav-item" id="nav-no" style="color: #F87171"><span class="nav-emoji">👎</span><span class="nav-text">拒绝</span></div>
        <div class="nav-item" id="nav-ok" style="color: #22D3EE"><span class="nav-emoji">👌</span><span class="nav-text">OK</span></div>
        <div class="nav-item" id="nav-point" style="color: #FACC15"><span class="nav-emoji">☝️</span><span class="nav-text">这个</span></div>
        
        <div class="nav-item border-l border-white/10 pl-4" id="nav-hello" style="color: #F472B6"><span class="nav-emoji">👋</span><span class="nav-text">你好</span></div>
        <div class="nav-item" id="nav-love" style="color: #E879F9"><span class="nav-emoji">🤟</span><span class="nav-text">爱你</span></div>
        <div class="nav-item" id="nav-rock" style="color: #A78BFA"><span class="nav-emoji">🤘</span><span class="nav-text">酷</span></div>
    </div>

    <div class="relative w-full h-screen overflow-hidden bg-gray-950">
        <video id="input-video" playsinline></video>
        <canvas id="output-canvas"></canvas>
        <canvas id="three-canvas"></canvas>
        <div class="scanlines"></div>

        <div class="absolute inset-0 pointer-events-none z-[35] select-none">
            <div class="absolute top-8 left-8 flex items-center gap-3">
                <div class="w-1 h-10 bg-cyan-500 shadow-[0_0_10px_#06b6d4]"></div>
                <div>
                    <h1 class="font-['Orbitron'] text-2xl font-bold text-white tracking-widest">VISION <span class="text-cyan-400">AR</span></h1>
                    <p class="font-mono text-[0.6rem] text-cyan-500/70 tracking-widest">COMMUNICATION LINK ACTIVE</p>
                </div>
            </div>
            <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[85vw] h-[70vh] border border-cyan-500/20 rounded-2xl">
                <div class="absolute -top-1 -left-1 w-6 h-6 border-t-2 border-l-2 border-cyan-400 rounded-tl-lg"></div>
                <div class="absolute -top-1 -right-1 w-6 h-6 border-t-2 border-r-2 border-cyan-400 rounded-tr-lg"></div>
                <div class="absolute -bottom-1 -left-1 w-6 h-6 border-b-2 border-l-2 border-cyan-400 rounded-bl-lg"></div>
                <div class="absolute -bottom-1 -right-1 w-6 h-6 border-b-2 border-r-2 border-cyan-400 rounded-br-lg"></div>
            </div>
        </div>
        
        <div id="gesture-hero" class="hero-text"></div>
    </div>

<script>
    const config = {
        videoWidth: 1280, videoHeight: 720,
        skeletonColor: '#06b6d4', jointColor: '#fff', jointBorder: '#ec4899', lineWidth: 4
    };

    let camera, hands, canvasCtx, outputCanvas, threeScene, threeCamera, threeRenderer;
    let particles = [], currentGesture = null;

    // --- 扩展的手势定义 ---
    const GESTURES = {
        'yes':   { name: 'YES',    cn: '确认', color: '#4ADE80', id: 'nav-yes' },
        'no':    { name: 'NO',     cn: '拒绝', color: '#F87171', id: 'nav-no' },
        'ok':    { name: 'OK',     cn: 'OK',   color: '#22D3EE', id: 'nav-ok' },
        'point': { name: 'THIS',   cn: '这个', color: '#FACC15', id: 'nav-point' },
        'wave':  { name: 'HELLO',  cn: '你好', color: '#F472B6', id: 'nav-hello' },
        'love':  { name: 'LOVE',   cn: '爱你', color: '#E879F9', id: 'nav-love' },
        'rock':  { name: 'ROCK',   cn: '酷',   color: '#A78BFA', id: 'nav-rock' }
    };

    window.onload = function() {
        outputCanvas = document.getElementById('output-canvas');
        canvasCtx = outputCanvas.getContext('2d');
        resizeLayout(); window.addEventListener('resize', resizeLayout);
        initThree(); initMediaPipe();
    };

    function resizeLayout() {
        const aspect = config.videoWidth / config.videoHeight;
        let w = window.innerWidth, h = window.innerHeight;
        if (w / h > aspect) { outputCanvas.width = w; outputCanvas.height = w / aspect; } 
        else { outputCanvas.height = h; outputCanvas.width = h * aspect; }
        const tCanvas = document.getElementById('three-canvas');
        tCanvas.width = outputCanvas.width; tCanvas.height = outputCanvas.height;
        if (threeRenderer) threeRenderer.setSize(outputCanvas.width, outputCanvas.height);
    }

    async function initMediaPipe() {
        const videoElement = document.getElementById('input-video');
        hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.6 });
        hands.onResults(onResults);
        camera = new Camera(videoElement, { onFrame: async () => { await hands.send({ image: videoElement }); }, width: config.videoWidth, height: config.videoHeight });
        try { await camera.start(); document.getElementById('loading').style.display = 'none'; } catch(e) { alert("无摄像头权限"); }
    }

    function onResults(results) {
        canvasCtx.save(); canvasCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
        canvasCtx.translate(outputCanvas.width, 0); canvasCtx.scale(-1, 1);
        canvasCtx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height); canvasCtx.restore();

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0];
            drawCyberSkeleton(landmarks);
            const gestureType = detectGestureSmart(landmarks); // 使用新的智能识别算法
            handleGestureUI(gestureType, landmarks);
        } else { handleGestureUI(null); }
    }

    // --- 智能手势识别算法 (核心修复) ---
    function detectGestureSmart(lm) {
        // 1. 基础工具函数
        const isExtended = (tip, pip) => lm[tip].y < lm[pip].y; // 手指是否向上伸直
        const dist = (i1, i2) => Math.hypot(lm[i1].x - lm[i2].x, lm[i1].y - lm[i2].y); // 两点距离

        // 2. 获取各手指状态 (伸直为 true)
        const iUp = isExtended(8, 6);  // 食指
        const mUp = isExtended(12, 10); // 中指
        const rUp = isExtended(16, 14); // 无名指
        const pUp = isExtended(20, 18); // 小指
        
        // 3. 拇指特殊判断 (拇指不能只看Y轴，要看相对位置)
        // 拇指尖(4) 是否远离 食指根部(5) -> 判断是否张开
        const thumbOut = dist(4, 5) > 0.05; 
        
        // 拇指尖(4) 是否高于 拇指关节(2) -> 判断是否竖起 (用于点赞)
        const thumbUp = lm[4].y < lm[2].y;

        // 4. 复杂手势逻辑树
        
        // --- 优先判断特殊的单指/双指手势 ---

        // [OK]: 拇指(4)和食指(8)距离很近，且其他三指伸直
        if (dist(4, 8) < 0.06 && mUp && rUp && pUp) return 'ok';

        // [Yes/点赞]: 只有拇指竖起，其他全缩回
        if (thumbUp && !iUp && !mUp && !rUp && !pUp) return 'yes';

        // [No/踩]: 拇指朝下 (拇指尖比关节低)，其他缩回
        // 注意：这里需要确保不是握拳，所以加一个距离限制
        if (lm[4].y > lm[2].y && !iUp && !mUp && !rUp && !pUp && dist(4, 2) > 0.05) return 'no';

        // [Point/One]: 只有食指伸直
        if (iUp && !mUp && !rUp && !pUp) return 'point';

        // --- 解决 Rock vs Love 冲突 ---
        
        // 共同点：食指 + 小指 伸直，中间两指弯曲
        if (iUp && pUp && !mUp && !rUp) {
            // 核心修复：测量拇指尖(4)到中指根部(9)的距离
            // Rock: 拇指通常压在弯曲的手指上，距离近
            // Love: 拇指必须向外张开，距离远
            
            // 阈值测试通常在 0.1 左右
            if (dist(4, 9) > 0.1) {
                return 'love'; // 拇指离得远 -> 爱你
            } else {
                return 'rock'; // 拇指离得近/压住 -> 酷
            }
        }

        // [Wave/Hello]: 五指全开
        // 增加拇指张开判断，防止和“4”混淆
        if (iUp && mUp && rUp && pUp && thumbOut) return 'wave';

        return null;
    }

    function drawCyberSkeleton(landmarks) {
        const toX = (val) => (1 - val) * outputCanvas.width;
        const toY = (val) => val * outputCanvas.height;
        const pts = landmarks.map(l => ({x: toX(l.x), y: toY(l.y)}));
        const bones = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17],[0,17]];

        canvasCtx.beginPath(); canvasCtx.lineWidth = config.lineWidth; canvasCtx.strokeStyle = config.skeletonColor; canvasCtx.lineCap = 'round';
        bones.forEach(([s, e]) => { canvasCtx.moveTo(pts[s].x, pts[s].y); canvasCtx.lineTo(pts[e].x, pts[e].y); });
        canvasCtx.stroke();

        pts.forEach((p, i) => {
            canvasCtx.beginPath(); canvasCtx.arc(p.x, p.y, (i%4===0&&i!==0)?6:4, 0, 2*Math.PI);
            canvasCtx.fillStyle = config.jointColor; canvasCtx.fill();
            canvasCtx.lineWidth = 2; canvasCtx.strokeStyle = config.jointBorder; canvasCtx.stroke();
        });
    }

    function handleGestureUI(key, lm) {
        const hero = document.getElementById('gesture-hero');
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if (key && GESTURES[key]) {
            const d = GESTURES[key];
            const nav = document.getElementById(d.id);
            if (nav) {
                nav.classList.add('active');
                nav.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); // 自动滚动到激活项
            }
            if (currentGesture !== key) {
                hero.innerText = d.name; hero.style.webkitTextStrokeColor = d.color;
                hero.style.textShadow = `0 0 40px ${d.color}`; hero.style.opacity = 1;
                hero.style.transform = 'translateX(-50%) scale(1.1)';
                if(lm) spawnParticles(lm[9], d.color);
                currentGesture = key;
            }
        } else {
            hero.style.opacity = 0; hero.style.transform = 'translateX(-50%) scale(0.9)';
            currentGesture = null;
        }
    }

    function initThree() {
        const c = document.getElementById('three-canvas');
        threeScene = new THREE.Scene(); threeCamera = new THREE.PerspectiveCamera(75, c.width/c.height, 0.1, 1000); threeCamera.position.z = 20;
        threeRenderer = new THREE.WebGLRenderer({ canvas: c, alpha: true }); threeRenderer.setSize(c.width, c.height);
        animateThree();
    }
    function spawnParticles(center, color) {
        const geo = new THREE.BufferGeometry(); const count=40; const pos = new Float32Array(count*3); const speeds=[];
        for(let i=0;i<count;i++){ pos[i*3]=0;pos[i*3+1]=0;pos[i*3+2]=0; speeds.push({x:(Math.random()-0.5)*0.8,y:(Math.random()-0.5)*0.8,z:(Math.random()-0.5)*0.8}); }
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const p = new THREE.Points(geo, new THREE.PointsMaterial({color:color, size:0.8, transparent:true}));
        p.position.set((0.5-center.x)*30, (0.5-center.y)*20, 0); p.userData={speeds,life:1.0};
        threeScene.add(p); particles.push(p);
    }
    function animateThree() {
        requestAnimationFrame(animateThree);
        for(let i=particles.length-1;i>=0;i--){
            const p=particles[i]; p.userData.life-=0.02; p.material.opacity=p.userData.life;
            const pos=p.geometry.attributes.position.array;
            for(let j=0;j<40;j++){ pos[j*3]+=p.userData.speeds[j].x; pos[j*3+1]+=p.userData.speeds[j].y; pos[j*3+2]+=p.userData.speeds[j].z; }
            p.geometry.attributes.position.needsUpdate=true;
            if(p.userData.life<=0){threeScene.remove(p);particles.splice(i,1);}
        }
        threeRenderer.render(threeScene, threeCamera);
    }
</script>
</body>
</html>
