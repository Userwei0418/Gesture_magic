<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞花令 - 传统文化问答</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 100%;
            height: 100vh;
            overflow: hidden; 
            background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 50%, #2d1b4e 100%);
            font-family: 'Microsoft YaHei', '宋体', serif;
        }
        
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(255, 182, 193, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(255, 218, 185, 0.1) 0%, transparent 50%);
        }
        
        /* 月亮 */
        .moon {
            position: fixed;
            top: 60px;
            right: 80px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #fffacd, #ffd700);
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.5), 0 0 120px rgba(255, 215, 0, 0.3);
            z-index: 1;
        }
        
        /* 加载屏幕 */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: opacity 0.5s ease;
        }
        
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-flower {
            font-size: 60px;
            animation: floatRotate 2s ease-in-out infinite;
            margin-bottom: 30px;
        }
        
        @keyframes floatRotate {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        
        #loading-text {
            font-size: 24px;
            color: #ffb6c1;
            text-align: center;
            text-shadow: 0 0 20px #ffb6c1;
        }
        
        .loading-bar {
            width: 200px;
            height: 4px;
            background: rgba(255, 182, 193, 0.2);
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
        }
        
        .loading-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #ffb6c1, #ff69b4);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #ffb6c1;
        }
        
        /* 题目显示 */
        #question-panel {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(45, 27, 78, 0.9);
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 20px 40px;
            z-index: 100;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        
        #question-category {
            font-size: 14px;
            color: #ffd700;
            margin-bottom: 8px;
        }
        
        #question-text {
            font-size: 24px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            line-height: 1.5;
        }
        
        #question-hint {
            font-size: 14px;
            color: #aaa;
            margin-top: 10px;
        }
        
        /* 分数面板 */
        #score-panel {
            position: fixed;
            top: 30px;
            left: 30px;
            background: rgba(45, 27, 78, 0.9);
            border: 2px solid #ff69b4;
            border-radius: 10px;
            padding: 15px 25px;
            z-index: 100;
        }
        
        #score-display {
            font-size: 20px;
            color: #ffb6c1;
            text-shadow: 0 0 10px #ffb6c1;
        }
        
        #streak-display {
            font-size: 16px;
            color: #ffd700;
            margin-top: 5px;
        }
        
        /* 进度面板 */
        #progress-panel {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(45, 27, 78, 0.9);
            border: 2px solid #87ceeb;
            border-radius: 10px;
            padding: 15px 25px;
            z-index: 100;
        }
        
        #round-display {
            font-size: 18px;
            color: #87ceeb;
        }
        
        #timer-display {
            font-size: 24px;
            color: #fff;
            margin-top: 5px;
        }
        
        #timer-display.urgent {
            color: #ff4444;
            animation: pulse 0.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        /* 手部追踪画布 */
        #hand-canvas-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            border: 2px solid #ffb6c1;
            border-radius: 10px;
            overflow: hidden;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
        }
        
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        
        #hand-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }
        
        /* 手势指示器 */
        #gesture-indicator {
            position: fixed;
            bottom: 180px;
            right: 20px;
            background: rgba(45, 27, 78, 0.9);
            border: 2px solid #ffb6c1;
            border-radius: 10px;
            padding: 10px 20px;
            z-index: 100;
            text-align: center;
        }
        
        #gesture-icon {
            font-size: 36px;
        }
        
        #gesture-text {
            font-size: 12px;
            color: #ffb6c1;
            margin-top: 5px;
        }
        
        /* 抓取光标 */
        #grab-cursor {
            position: fixed;
            width: 80px;
            height: 80px;
            pointer-events: none;
            z-index: 500;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease;
        }
        
        #grab-cursor .cursor-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 3px solid #ffb6c1;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 182, 193, 0.5);
            transition: all 0.2s ease;
        }
        
        #grab-cursor.grabbing .cursor-ring {
            transform: scale(0.6);
            border-color: #ff69b4;
            border-width: 5px;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.8);
        }
        
        #grab-cursor .cursor-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30px;
            transition: transform 0.2s ease;
        }
        
        #grab-cursor.grabbing .cursor-icon {
            transform: translate(-50%, -50%) scale(0.8);
        }
        
        /* 花瓣容器 */
        #petals-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
        
        /* 答案花瓣 */
        .answer-petal {
            position: absolute;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.95), rgba(255, 105, 180, 0.9));
            border-radius: 50% 0 50% 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            pointer-events: auto;
            box-shadow: 0 5px 20px rgba(255, 105, 180, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            z-index: 60;
        }
        
        .answer-petal::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            width: 30%;
            height: 30%;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
        }
        
        .answer-petal .petal-text {
            font-size: 16px;
            color: #4a0e4e;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            line-height: 1.3;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
        }
        
        .answer-petal.correct {
            background: linear-gradient(135deg, rgba(144, 238, 144, 0.95), rgba(50, 205, 50, 0.9));
        }
        
        .answer-petal.wrong {
            background: linear-gradient(135deg, rgba(255, 99, 71, 0.95), rgba(220, 20, 60, 0.9));
        }
        
        .answer-petal.grabbed {
            transform: scale(1.2);
            box-shadow: 0 10px 40px rgba(255, 105, 180, 0.6);
            z-index: 100;
        }
        
        /* 装饰花瓣 */
        .deco-petal {
            position: absolute;
            pointer-events: none;
            opacity: 0.6;
        }
        
        /* 结果提示 */
        #result-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(45, 27, 78, 0.95);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 40px 60px;
            z-index: 200;
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        #result-popup.show {
            transform: translate(-50%, -50%) scale(1);
        }
        
        #result-popup .result-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        #result-popup .result-text {
            font-size: 28px;
            color: #fff;
            margin-bottom: 10px;
        }
        
        #result-popup .result-detail {
            font-size: 18px;
            color: #ffb6c1;
        }
        
        #result-popup .result-points {
            font-size: 24px;
            color: #ffd700;
            margin-top: 15px;
        }
        
        /* 提示文字 */
        #hint-text {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            color: #ffb6c1;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
            z-index: 100;
            background: rgba(45, 27, 78, 0.8);
            padding: 10px 30px;
            border-radius: 25px;
        }
        
        /* 游戏结束面板 */
        #game-over-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 46, 0.95);
            z-index: 300;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        
        #game-over-panel.show {
            opacity: 1;
            pointer-events: auto;
        }
        
        #game-over-panel h1 {
            font-size: 48px;
            color: #ffd700;
            margin-bottom: 30px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        
        #final-stats {
            background: rgba(45, 27, 78, 0.9);
            border: 2px solid #ffb6c1;
            border-radius: 15px;
            padding: 30px 50px;
            text-align: center;
        }
        
        #final-stats .stat-item {
            font-size: 20px;
            color: #fff;
            margin: 15px 0;
        }
        
        #final-stats .stat-value {
            color: #ffd700;
            font-size: 28px;
            font-weight: bold;
        }
        
        #restart-btn {
            margin-top: 30px;
            padding: 15px 50px;
            font-size: 24px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            border: none;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 105, 180, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        #restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 105, 180, 0.7);
        }

        /* 调试信息 */
        #debug-info {
            position: fixed;
            top: 150px;
            left: 30px;
            font-size: 12px;
            color: #888;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="loading-flower">🌸</div>
        <div id="loading-text">飞花令 · 准备中...</div>
        <div class="loading-bar">
            <div class="loading-bar-inner" id="progress-bar"></div>
        </div>
    </div>

    <div id="game-container">
        <div class="bg-decoration"></div>
        <div class="moon"></div>
        
        <div id="question-panel">
            <div id="question-category">🏮 传统节日</div>
            <div id="question-text">准备开始...</div>
            <div id="question-hint">抓取正确的花瓣答案</div>
        </div>
        
        <div id="score-panel">
            <div id="score-display">🌸 得分: 0</div>
            <div id="streak-display">🔥 连对: 0</div>
        </div>
        
        <div id="progress-panel">
            <div id="round-display">第 1/10 题</div>
            <div id="timer-display">⏱️ 15</div>
        </div>
        
        <div id="petals-container"></div>
        
        <div id="grab-cursor">
            <div class="cursor-ring"></div>
            <div class="cursor-icon">✋</div>
        </div>
        
        <div id="gesture-indicator">
            <div id="gesture-icon">👋</div>
            <div id="gesture-text">张开手掌移动</div>
        </div>
        
        <div id="hand-canvas-container">
            <video id="webcam" autoplay muted playsinline></video>
            <canvas id="hand-canvas"></canvas>
        </div>
        
        <div id="hint-text">👋 张开手移动，✊ 握拳抓取花瓣</div>
        
        <div id="result-popup">
            <div class="result-icon">✅</div>
            <div class="result-text">正确!</div>
            <div class="result-detail">明月几时有，把酒问青天</div>
            <div class="result-points">+100</div>
        </div>
        
        <div id="game-over-panel">
            <h1>🌸 飞花令 · 结束 🌸</h1>
            <div id="final-stats">
                <div class="stat-item">最终得分: <span class="stat-value" id="final-score">0</span></div>
                <div class="stat-item">正确答题: <span class="stat-value" id="final-correct">0/10</span></div>
                <div class="stat-item">最高连对: <span class="stat-value" id="final-streak">0</span></div>
                <div class="stat-item">称号: <span class="stat-value" id="final-title">诗词新秀</span></div>
            </div>
            <button id="restart-btn" onclick="restartGame()">🌸 再来一局</button>
        </div>
        
        <div id="debug-info"></div>
    </div>

    <!-- MediaPipe 资源 -->
    <script src="./js/camera_utils.js"></script>
    <script src="./js/drawing_utils.js"></script>
    <script src="./js/hands.js"></script>

    <script>
        'use strict';

        // ===== 题库 =====
        const QUESTIONS = [
            // 中秋节相关
            {
                category: "🌕 中秋节",
                question: "下列哪句诗是描写中秋节的？",
                answers: [
                    { text: "明月几时有", correct: true },
                    { text: "清明时节雨纷纷", correct: false },
                    { text: "爆竹声中一岁除", correct: false },
                    { text: "遥知兄弟登高处", correct: false }
                ],
                explanation: "《水调歌头》苏轼 - 明月几时有，把酒问青天"
            },
            {
                category: "🌕 中秋节",
                question: "\"但愿人长久，千里共婵娟\"中的\"婵娟\"指什么？",
                answers: [
                    { text: "月亮", correct: true },
                    { text: "美女", correct: false },
                    { text: "花朵", correct: false },
                    { text: "星星", correct: false }
                ],
                explanation: "婵娟在此诗中指月亮，表达对亲人的思念"
            },
            {
                category: "🌕 中秋节",
                question: "中秋节又被称为什么？",
                answers: [
                    { text: "团圆节", correct: true },
                    { text: "踏青节", correct: false },
                    { text: "重阳节", correct: false },
                    { text: "上元节", correct: false }
                ],
                explanation: "中秋节因家人团聚赏月而得名团圆节"
            },
            // 春节相关
            {
                category: "🧨 春节",
                question: "\"爆竹声中一岁除\"的下一句是？",
                answers: [
                    { text: "春风送暖入屠苏", correct: true },
                    { text: "千门万户曈曈日", correct: false },
                    { text: "总把新桃换旧符", correct: false },
                    { text: "东风夜放花千树", correct: false }
                ],
                explanation: "王安石《元日》- 描写春节的热闹场景"
            },
            {
                category: "🧨 春节",
                question: "春节的传统习俗不包括哪项？",
                answers: [
                    { text: "赛龙舟", correct: true },
                    { text: "贴春联", correct: false },
                    { text: "放鞭炮", correct: false },
                    { text: "守岁", correct: false }
                ],
                explanation: "赛龙舟是端午节的习俗"
            },
            // 端午节相关
            {
                category: "🐲 端午节",
                question: "端午节是为了纪念哪位诗人？",
                answers: [
                    { text: "屈原", correct: true },
                    { text: "李白", correct: false },
                    { text: "杜甫", correct: false },
                    { text: "白居易", correct: false }
                ],
                explanation: "屈原投汨罗江，人们划龙舟、包粽子纪念他"
            },
            {
                category: "🐲 端午节",
                question: "\"路漫漫其修远兮\"出自哪部作品？",
                answers: [
                    { text: "《离骚》", correct: true },
                    { text: "《诗经》", correct: false },
                    { text: "《楚辞》其他篇", correct: false },
                    { text: "《论语》", correct: false }
                ],
                explanation: "《离骚》是屈原的代表作"
            },
            // 清明节相关
            {
                category: "🌿 清明节",
                question: "\"清明时节雨纷纷\"的作者是？",
                answers: [
                    { text: "杜牧", correct: true },
                    { text: "杜甫", correct: false },
                    { text: "李白", correct: false },
                    { text: "白居易", correct: false }
                ],
                explanation: "杜牧《清明》- 清明时节雨纷纷，路上行人欲断魂"
            },
            // 重阳节相关
            {
                category: "🏔️ 重阳节",
                question: "重阳节的日期是农历几月几日？",
                answers: [
                    { text: "九月初九", correct: true },
                    { text: "八月十五", correct: false },
                    { text: "五月初五", correct: false },
                    { text: "正月十五", correct: false }
                ],
                explanation: "九九重阳，因日月并阳，两九相重而得名"
            },
            {
                category: "🏔️ 重阳节",
                question: "\"遥知兄弟登高处，遍插茱萸少一人\"描写的是哪个节日？",
                answers: [
                    { text: "重阳节", correct: true },
                    { text: "中秋节", correct: false },
                    { text: "清明节", correct: false },
                    { text: "端午节", correct: false }
                ],
                explanation: "王维《九月九日忆山东兄弟》"
            },
            // 元宵节相关
            {
                category: "🏮 元宵节",
                question: "元宵节又称什么节？",
                answers: [
                    { text: "上元节", correct: true },
                    { text: "中元节", correct: false },
                    { text: "下元节", correct: false },
                    { text: "寒食节", correct: false }
                ],
                explanation: "正月十五为上元节，七月十五为中元节，十月十五为下元节"
            },
            {
                category: "🏮 元宵节",
                question: "\"东风夜放花千树，更吹落、星如雨\"描写的是？",
                answers: [
                    { text: "元宵灯会", correct: true },
                    { text: "春节烟花", correct: false },
                    { text: "七夕乞巧", correct: false },
                    { text: "中秋赏月", correct: false }
                ],
                explanation: "辛弃疾《青玉案·元夕》描写元宵节盛况"
            },
            // 七夕相关
            {
                category: "💕 七夕节",
                question: "七夕节与哪个传说有关？",
                answers: [
                    { text: "牛郎织女", correct: true },
                    { text: "嫦娥奔月", correct: false },
                    { text: "白蛇传", correct: false },
                    { text: "梁祝", correct: false }
                ],
                explanation: "七夕源于牛郎织女鹊桥相会的传说"
            },
            {
                category: "💕 七夕节",
                question: "\"金风玉露一相逢，便胜却人间无数\"出自？",
                answers: [
                    { text: "《鹊桥仙》", correct: true },
                    { text: "《长恨歌》", correct: false },
                    { text: "《离骚》", correct: false },

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getRandomQuestions(count) {
            const shuffled = shuffleArray(QUESTIONS);
            return shuffled.slice(0, count);

        // ===== 音效 =====
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playGrabSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (e) {}
        }

        function playCorrectSound() {
            if (!audioCtx) return;
            try {
                const notes = [523, 659, 784];
                notes.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + i * 0.1);
                    osc.stop(audioCtx.currentTime + i * 0.1 + 0.2);
                });
            } catch (e) {}
        }

        function playWrongSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {}
        }

        // ===== 手势检测 =====
        function isOpenHand(landmarks) {
            if (!landmarks || landmarks.length < 21) return false;
            
            try {
                // 检测所有手指是否伸直
                const fingerTips = [8, 12, 16, 20];  // 食指、中指、无名指、小指尖
                const fingerPIPs = [6, 10, 14, 18];  // 对应的PIP关节
                
                let extendedCount = 0;
                for (let i = 0; i < 4; i++) {
                    if (landmarks[fingerTips[i]].y < landmarks[fingerPIPs[i]].y) {
                        extendedCount++;
                    }
                }
                
                return extendedCount >= 3;
            } catch (e) {
                return false;
            }
        }

        function isGrabGesture(landmarks) {
            if (!landmarks || landmarks.length < 21) return false;
            
            try {
                // 检测握拳动作 - 手指弯曲
                const fingerTips = [8, 12, 16, 20];
                const fingerPIPs = [6, 10, 14, 18];
                
                let bentCount = 0;
                for (let i = 0; i < 4; i++) {
                    // 指尖y坐标大于PIP关节 = 手指弯曲
                    if (landmarks[fingerTips[i]].y > landmarks[fingerPIPs[i]].y) {
                        bentCount++;
                    }
                }
                
                // 检测拇指是否收拢
                const thumbTip = landmarks[4];
                const indexMCP = landmarks[5];
                const thumbToIndex = Math.sqrt(
                    Math.pow(thumbTip.x - indexMCP.x, 2) + 
                    Math.pow(thumbTip.y - indexMCP.y, 2)
                );
                
                const thumbBent = thumbToIndex < 0.12;
                
                return bentCount >= 3 && thumbBent;
            } catch (e) {
                return false;
            }
        }

        function getHandCenter(landmarks) {
            if (!landmarks || landmarks.length < 21) return null;
            
            // 使用手掌中心点
            const palmPoints = [0, 5, 9, 13, 17];
            let sumX = 0, sumY = 0;
            
            for (const idx of palmPoints) {
                sumX += landmarks[idx].x;
                sumY += landmarks[idx].y;
            }
            
            return {
                x: (1 - sumX / palmPoints.length) * window.innerWidth,  // 镜像翻转
                y: (sumY / palmPoints.length) * window.innerHeight
            };
        }

        // ===== MediaPipe 初始化 =====
        async function initMediaPipe() {
            return new Promise((resolve, reject) => {
                const hands = new Hands({
                    locateFile: (file) => `./js/hands/${file}`
                });
                
                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.7,
                    minTrackingConfidence: 0.6
                });

                hands.onResults((results) => {
                    try {
                        handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

                        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                            handState.detected = true;
                            const landmarks = results.multiHandLandmarks[0];
                            
                            // 绘制手部骨架
                            drawConnectors(handCtx, landmarks, HAND_CONNECTIONS,
                                { color: '#ffb6c1', lineWidth: 2 });
                            drawLandmarks(handCtx, landmarks,
                                { color: '#ffffff', lineWidth: 1, radius: 3 });

                            // 获取手部位置
                            const center = getHandCenter(landmarks);
                            if (center) {
                                handState.position = center;
                            }
                            
                            // 检测手势
                            const wasGrabbing = handState.isGrabbing;
                            handState.isGrabbing = isGrabGesture(landmarks);
                            
                            // 抓取状态变化
                            if (handState.isGrabbing && !wasGrabbing) {
                                onGrabStart();
                            } else if (!handState.isGrabbing && wasGrabbing) {
                                onGrabEnd();
                            }
                            
                            updateGestureIndicator();
                            
                        } else {
                            handState.detected = false;
                            handState.isGrabbing = false;
                            updateGestureIndicator();
                        }
                    } catch (e) {
                        console.error('手势处理错误:', e);
                    }
                });

                const cameraInstance = new Camera(webcamVideo, {
                    onFrame: async () => {
                        if (!gameState.isPaused) {
                            await hands.send({ image: webcamVideo });
                        }
                    },
                    width: 640,
                    height: 480
                });
                
                cameraInstance.start()
                    .then(() => {
                        console.log('摄像头已启动');
                        resolve();
                    })
                    .catch((e) => {
                        console.error('摄像头启动失败:', e);
                        reject(e);
                    });
            });
        }

        function updateGestureIndicator() {
            const icon = document.getElementById('gesture-icon');
            const text = document.getElementById('gesture-text');
            
            if (!handState.detected) {
                icon.textContent = '❓';
                text.textContent = '未检测到手';
            } else if (handState.isGrabbing) {
                icon.textContent = '✊';
                text.textContent = '抓取中...';
            } else {
                icon.textContent = '✋';
                text.textContent = '张开手移动';
            }
        }

        // ===== 花瓣系统 =====
        function createAnswerPetal(answer, index, total) {
            const petal = document.createElement('div');
            petal.className = 'answer-petal';
            petal.innerHTML = `<span class="petal-text">${answer.text}</span>`;
            
            // 计算初始位置 - 均匀分布在屏幕上方
            const spacing = window.innerWidth / (total + 1);
            const startX = spacing * (index + 1);
            const startY = -100 - Math.random() * 100;
            
            // 随机大小
            const size = 100 + Math.random() * 40;
            petal.style.width = size + 'px';
            petal.style.height = size + 'px';
            
            const petalData = {
                element: petal,
                x: startX,
                y: startY,
                vx: (Math.random() - 0.5) * CONFIG.PETAL_SWAY,
                vy: CONFIG.PETAL_FALL_SPEED + Math.random() * 0.5,
                rotation: Math.random() * 360,
                rotationSpeed: (Math.random() - 0.5) * 2,
                swayPhase: Math.random() * Math.PI * 2,
                size: size,
                answer: answer,
                grabbed: false
            };
            
            petalsContainer.appendChild(petal);
            return petalData;
        }

        function createDecoPetal() {
            const colors = ['#ffb6c1', '#ffc0cb', '#ff69b4', '#ffaec9', '#ffd1dc'];
            const petal = document.createElement('div');
            petal.className = 'deco-petal';
            
            const size = 15 + Math.random() * 20;
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            petal.style.width = size + 'px';
            petal.style.height = size + 'px';
            petal.style.backgroundColor = color;
            petal.style.borderRadius = '50% 0 50% 50%';
            
            const petalData = {
                element: petal,
                x: Math.random() * window.innerWidth,
                y: -50,
                vx: (Math.random() - 0.5) * 1,
                vy: 0.5 + Math.random() * 1,
                rotation: Math.random() * 360,
                rotationSpeed: (Math.random() - 0.5) * 3,
                swayPhase: Math.random() * Math.PI * 2
            };
            
            petalsContainer.appendChild(petal);
            return petalData;
        }

        function updatePetals() {
            const time = Date.now() / 1000;
            
            // 更新答案花瓣
            for (let petal of gameState.answerPetals) {
                if (petal.grabbed && gameState.grabbedPetal === petal) {
                    // 被抓住的花瓣跟随手
                    petal.x = lerp(petal.x, handState.smoothPosition.x, 0.3);
                    petal.y = lerp(petal.y, handState.smoothPosition.y, 0.3);
                } else {
                    // 正常飘落
                    petal.x += petal.vx + Math.sin(time + petal.swayPhase) * CONFIG.PETAL_SWAY;
                    petal.y += petal.vy;
                    
                    // 边界反弹
                    if (petal.x < 50) {
                        petal.x = 50;
                        petal.vx = Math.abs(petal.vx);
                    }
                    if (petal.x > window.innerWidth - 50) {
                        petal.x = window.innerWidth - 50;
                        petal.vx = -Math.abs(petal.vx);
                    }
                    
                    // 到达底部重置
                    if (petal.y > window.innerHeight + 100) {
                        petal.y = -100;
                        petal.x = Math.random() * (window.innerWidth - 100) + 50;
                    }
                }
                
                petal.rotation += petal.rotationSpeed;
                
                petal.element.style.transform = `translate(${petal.x - petal.size/2}px, ${petal.y - petal.size/2}px) rotate(${petal.rotation}deg)`;
            }
            
            // 更新装饰花瓣
            for (let i = gameState.decoPetals.length - 1; i >= 0; i--) {
                const petal = gameState.decoPetals[i];
                petal.x += petal.vx + Math.sin(time + petal.swayPhase) * 0.5;
                petal.y += petal.vy;
                petal.rotation += petal.rotationSpeed;
                
                if (petal.y > window.innerHeight + 50) {
                    petal.element.remove();
                    gameState.decoPetals.splice(i, 1);
                } else {
                    petal.element.style.transform = `translate(${petal.x}px, ${petal.y}px) rotate(${petal.rotation}deg)`;
                }
            }
            
            // 添加新的装饰花瓣
            if (Math.random() < 0.02 && gameState.decoPetals.length < 30) {
                gameState.decoPetals.push(createDecoPetal());
            }
        }

        function clearAnswerPetals() {
            for (const petal of gameState.answerPetals) {
                petal.element.remove();
            }
            gameState.answerPetals = [];
            gameState.grabbedPetal = null;
        }

        // ===== 抓取逻辑 =====
        function onGrabStart() {
            if (!gameState.isPlaying || gameState.grabbedPetal) return;
            
            initAudio();
            
            // 检测是否抓到花瓣
            for (const petal of gameState.answerPetals) {
                const dist = Math.sqrt(
                    Math.pow(handState.smoothPosition.x - petal.x, 2) +
                    Math.pow(handState.smoothPosition.y - petal.y, 2)
                );
                
                if (dist < CONFIG.GRAB_DISTANCE) {
                    petal.grabbed = true;
                    petal.element.classList.add('grabbed');
                    gameState.grabbedPetal = petal;
                    playGrabSound();
                    break;
                }
            }
        }

        function onGrabEnd() {
            if (!gameState.grabbedPetal) return;
            
            const petal = gameState.grabbedPetal;
            petal.grabbed = false;
            petal.element.classList.remove('grabbed');
            
            // 检查是否在题目区域释放（选择答案）
            const questionPanel = document.getElementById('question-panel');
            const rect = questionPanel.getBoundingClientRect();
            
            // 放宽判断区域 - 屏幕上半部分都算
            if (petal.y < window.innerHeight * 0.4) {
                checkAnswer(petal.answer);
            }
            
            gameState.grabbedPetal = null;
        }

        // ===== 答案检查 =====
        function checkAnswer(answer) {
            if (!gameState.isPlaying) return;
            
            gameState.isPlaying = false;
            clearInterval(timerInterval);
            
            const isCorrect = answer.correct;
            
            if (isCorrect) {
                // 正确答案
                playCorrectSound();
                
                const timeBonus = Math.floor(gameState.timeLeft * CONFIG.TIME_BONUS);
                const streakBonus = gameState.streak * CONFIG.STREAK_BONUS;
                const points = CONFIG.BASE_SCORE + timeBonus + streakBonus;
                
                gameState.score += points;
                gameState.streak++;
                gameState.correctCount++;
                if (gameState.streak > gameState.maxStreak) {
                    gameState.maxStreak = gameState.streak;
                }
                
                // 标记正确花瓣
                for (const petal of gameState.answerPetals) {
                    if (petal.answer.correct) {
                        petal.element.classList.add('correct');
                    }
                }
                
                showResult(true, gameState.currentQuestion.explanation, points);
            } else {
                // 错误答案
                playWrongSound();
                gameState.streak = 0;
                
                // 标记错误和正确花瓣
                for (const petal of gameState.answerPetals) {
                    if (petal.answer === answer) {
                        petal.element.classList.add('wrong');
                    } else if (petal.answer.correct) {
                        petal.element.classList.add('correct');
                    }
                }
                
                showResult(false, gameState.currentQuestion.explanation, 0);
            }
            
            updateUI();
            
            // 延迟进入下一题
            setTimeout(() => {
                hideResult();
                setTimeout(() => {
                    nextQuestion();
                }, 300);
            }, 2500);
        }

        function showResult(isCorrect, explanation, points) {
            const popup = document.getElementById('result-popup');
            popup.querySelector('.result-icon').textContent = isCorrect ? '✅' : '❌';
            popup.querySelector('.result-text').textContent = isCorrect ? '正确!' : '错误!';
            popup.querySelector('.result-detail').textContent = explanation;
            popup.querySelector('.result-points').textContent = isCorrect ? `+${points}` : '继续加油!';
            popup.querySelector('.result-points').style.color = isCorrect ? '#ffd700' : '#ff6b6b';
            popup.classList.add('show');
        }

        function hideResult() {
            document.getElementById('result-popup').classList.remove('show');
        }

        // ===== 游戏流程 =====
        let questionPool = [];

        function startGame() {
            questionPool = getRandomQuestions(CONFIG.TOTAL_ROUNDS);
            gameState = {
                score: 0,
                currentRound: 0,
                streak: 0,
                maxStreak: 0,
                correctCount: 0,
                timeLeft: CONFIG.TIME_PER_QUESTION,
                isPlaying: false,
                isPaused: false,
                currentQuestion: null,
                answerPetals: [],
                decoPetals: gameState.decoPetals || [],
                grabbedPetal: null
            };
            
            document.getElementById('game-over-panel').classList.remove('show');
            updateUI();
            nextQuestion();
        }

        function nextQuestion() {
            clearAnswerPetals();
            
            if (gameState.currentRound >= CONFIG.TOTAL_ROUNDS) {
                endGame();
                return;
            }
            
            gameState.currentQuestion = questionPool[gameState.currentRound];
            gameState.currentRound++;
            gameState.timeLeft = CONFIG.TIME_PER_QUESTION;
            gameState.isPlaying = true;
            
            // 更新UI
            document.getElementById('question-category').textContent = gameState.currentQuestion.category;
            document.getElementById('question-text').textContent = gameState.currentQuestion.question;
            document.getElementById('round-display').textContent = `第 ${gameState.currentRound}/${CONFIG.TOTAL_ROUNDS} 题`;
            
            // 创建答案花瓣
            const shuffledAnswers = shuffleArray(gameState.currentQuestion.answers);
            for (let i = 0; i < shuffledAnswers.length; i++) {
                gameState.answerPetals.push(
                    createAnswerPetal(shuffledAnswers[i], i, shuffledAnswers.length)
                );
            }
            
            // 开始计时
            updateTimer();
            timerInterval = setInterval(() => {
                gameState.timeLeft--;
                updateTimer();
                
                if (gameState.timeLeft <= 0) {
                    timeUp();
                }
            }, 1000);
        }

        function timeUp() {
            if (!gameState.isPlaying) return;
            
            gameState.isPlaying = false;
            clearInterval(timerInterval);
            gameState.streak = 0;
            
            playWrongSound();
            
            // 标记正确答案
            for (const petal of gameState.answerPetals) {
                if (petal.answer.correct) {
                    petal.element.classList.add('correct');
                }
            }
            
            showResult(false, "时间到! " + gameState.currentQuestion.explanation, 0);
            updateUI();
            
            setTimeout(() => {
                hideResult();
                setTimeout(() => {
                    nextQuestion();
                }, 300);
            }, 2500);
        }

        function endGame() {
            gameState.isPlaying = false;
            clearInterval(timerInterval);
            
            // 计算称号
            let title = '诗词新秀';
            const accuracy = gameState.correctCount / CONFIG.TOTAL_ROUNDS;
            if (accuracy >= 0.9) title = '诗词大师';
            else if (accuracy >= 0.7) title = '诗词才子';
            else if (accuracy >= 0.5) title = '诗词爱好者';
            
            document.getElementById('final-score').textContent = gameState.score;
            document.getElementById('final-correct').textContent = `${gameState.correctCount}/${CONFIG.TOTAL_ROUNDS}`;
            document.getElementById('final-streak').textContent = gameState.maxStreak;
            document.getElementById('final-title').textContent = title;
            
            document.getElementById('game-over-panel').classList.add('show');
        }

        function restartGame() {
            startGame();
        }

        // ===== UI更新 =====
        function updateUI() {
            document.getElementById('score-display').textContent = `🌸 得分: ${gameState.score}`;
            document.getElementById('streak-display').textContent = `🔥 连对: ${gameState.streak}`;
        }

        function updateTimer() {
            const timerEl = document.getElementById('timer-display');
            timerEl.textContent = `⏱️ ${gameState.timeLeft}`;
            
            if (gameState.timeLeft <= 5) {
                timerEl.classList.add('urgent');
            } else {
                timerEl.classList.remove('urgent');
            }
        }

        function updateCursor() {
            // 平滑光标位置
            handState.smoothPosition.x = lerp(handState.smoothPosition.x, handState.position.x, 0.2);
            handState.smoothPosition.y = lerp(handState.smoothPosition.y, handState.position.y, 0.2);
            
            grabCursor.style.left = handState.smoothPosition.x + 'px';
            grabCursor.style.top = handState.smoothPosition.y + 'px';
            
            if (handState.isGrabbing) {
                grabCursor.classList.add('grabbing');
                grabCursor.querySelector('.cursor-icon').textContent = '✊';
            } else {
                grabCursor.classList.remove('grabbing');
                grabCursor.querySelector('.cursor-icon').textContent = '✋';
            }
            
            grabCursor.style.display = handState.detected ? 'block' : 'none';
        }

        // ===== 主循环 =====
        function gameLoop() {
            updateCursor();
            updatePetals();
            animationId = requestAnimationFrame(gameLoop);
        }

        // ===== 初始化 =====
        window.addEventListener('load', async () => {
            try {
                document.getElementById('loading-text').textContent = '初始化场景...';
                updateLoadingProgress(10);
                
                handCanvas.width = 200;
                handCanvas.height = 150;
                
                updateLoadingProgress(30);
                document.getElementById('loading-text').textContent = '加载手势识别...';
                
                // 等待 MediaPipe 库加载
                let attempts = 0;
                while (typeof Hands === 'undefined' || typeof Camera === 'undefined') {
                    if (attempts++ > 50) {
                        throw new Error('MediaPipe 库加载超时');
                    }
                    await new Promise(r => setTimeout(r, 100));
                    updateLoadingProgress(30 + attempts);
                }
                
                updateLoadingProgress(60);
                document.getElementById('loading-text').textContent = '启动摄像头...';
                
                await initMediaPipe();
                updateLoadingProgress(90);
                
                document.getElementById('loading-text').textContent = '准备就绪!';
                
                // 启动游戏
                gameLoop();
                startGame();
                
                updateLoadingProgress(100);
                setTimeout(hideLoadingScreen, 500);
                
                // 点击激活音频
                document.addEventListener('click', initAudio, { once: true });
                document.addEventListener('touchstart', initAudio, { once: true });
                
            } catch (error) {
                console.error('初始化错误:', error);
                document.getElementById('loading-text').textContent = 
                    '❌ 初始化失败: ' + error.message;
                document.getElementById('loading-text').style.color = '#ff6b6b';
            }
        });

        // 键盘调试
        document.addEventListener('keydown', (e) => {
            if (e.key === 'p') {
                gameState.isPaused = !gameState.isPaused;
            }
            if (e.key === 'r') {
                restartGame();
            }
            if (e.key === 'd') {
                const debug = document.getElementById('debug-info');
                debug.style.display = debug.style.display === 'none' ? 'block' : 'none';
            }
        });

        // 页面可见性
        document.addEventListener('visibilitychange', () => {
            gameState.isPaused = document.hidden;
        });
    </script>
</body>
</html>
